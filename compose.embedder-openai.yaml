# Optional override: replace the built-in local embedder with an OpenAI-compatible one
# (text-embedding-3-small) reached through llm-api-guard, like chat. Settings only; the same
# values can be entered in AnythingLLM under Settings > Embedder.
#   scripts\start-stack.ps1 -Embedder openai
# Switching the embedder changes the vector size (384 -> 1536), so the workspace documents must
# be re-embedded afterwards (python -m rag_audit reembed).
services:
  anythingllm:
    environment:
      EMBEDDING_ENGINE: generic-openai
      EMBEDDING_BASE_PATH: http://host.docker.internal:18431/v1
      EMBEDDING_MODEL_PREF: text-embedding-3-small
      # AnythingLLM also uses this as the text-splitter chunk size. The default 1000 keeps the
      # baseline's ~900-char chunks, so only the embedder changes (candidate-openai-embedder-1000).
      # The first, confounded candidate (candidate-openai-embedder) was measured with 8191, which
      # gives ~6k-char chunks: set $env:EMBEDDING_MODEL_MAX_CHUNK_LENGTH = '8191' to repeat it.
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "${EMBEDDING_MODEL_MAX_CHUNK_LENGTH:-1000}"
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: ${GUARD_TOKEN:?GUARD_TOKEN must be set by scripts/start-stack.ps1}
      GENERIC_OPEN_AI_EMBEDDING_MAX_CONCURRENT_CHUNKS: "50"
